<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis horarios</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Mis horarios</h1>

        <div class="selector">
            <button id="horarioA" class="active">Horario A</button>
            <button id="horarioB">Horario B</button>
        </div>

        <div class="vistas">
            <button id="vistaSemana" class="active">Semana</button>
            <button id="vistaMes">Mes</button>
        </div>
    </header>

    <main>
        <div class="barra-superior">
            <button id="mesAnterior">‹</button>
            <h2 id="tituloCalendario"></h2>
            <button id="mesSiguiente">›</button>
        </div>

        <button id="añadirEvento" class="boton-añadir">
            + Añadir evento
        </button>

        <div id="calendario"></div>
    </main>

    <div id="modal" class="modal oculto">
        <div class="modal-contenido">
            <h2 id="tituloModal">Añadir evento</h2>

            <label>Nombre</label>
            <input type="text" id="nombreEvento" placeholder="Ej. Matemáticas">

            <label>Día</label>
            <select id="diaEvento">
                <option value="1">Lunes</option>
                <option value="2">Martes</option>
                <option value="3">Miércoles</option>
                <option value="4">Jueves</option>
                <option value="5">Viernes</option>
                <option value="6">Sábado</option>
                <option value="0">Domingo</option>
            </select>

            <label>Hora de inicio</label>
            <input type="time" id="horaInicio">

            <label>Hora de finalización</label>
            <input type="time" id="horaFin">

            <label>Color</label>
            <input type="color" id="colorEvento" value="#6366f1">

            <div class="acciones-modal">
                <button id="cancelarEvento">Cancelar</button>
                <button id="guardarEvento" class="guardar">Guardar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
